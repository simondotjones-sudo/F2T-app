name: Import EazySAFE source
on:
  push:
    branches: [main]
    paths: [.github/workflows/import-eazysafe.yml]
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Copy the verified Release 89 source
        run: |
          set -euo pipefail
          test "$(git ls-files | wc -l)" -eq 1
          git remote add source https://github.com/simondotjones-sudo/eazysafe-LC4.git
          git fetch --no-tags source 9c40e098a488bea1ed7db9591fa5ac5013603b70
          test "$(git rev-parse FETCH_HEAD^{tree})" = 282cd92dbaffa2f33821343be4bd79fa39e399de
          git read-tree --reset -u FETCH_HEAD
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Clone EazySAFE-LC4 Release 89 into F2T-app" -m "Source: simondotjones-sudo/eazysafe-LC4@9c40e098a488bea1ed7db9591fa5ac5013603b70. Exact 705-file source snapshot; no database, storage or credentials copied."
          test "$(git rev-parse HEAD^{tree})" = 282cd92dbaffa2f33821343be4bd79fa39e399de
          git push origin HEAD:main
