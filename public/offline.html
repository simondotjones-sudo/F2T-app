<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="eazysafe-offline-page" content="1"><title>You are offline</title><style>body{margin:0;min-height:100dvh;display:grid;place-items:center;background:#f6f7f9;color:#17212b;font-family:system-ui,sans-serif}main{max-width:440px;margin:24px;padding:32px;background:white;border-radius:24px;text-align:center;box-shadow:0 8px 40px #17212b0a}h1{font-size:1.75rem}p{line-height:1.6;color:#4b5563}button{border:0;border-radius:999px;padding:14px 24px;background:#17212b;color:white;font:inherit;cursor:pointer}button:focus-visible{outline:3px solid #1682af;outline-offset:3px}</style></head><body><main><h1 id="title">You are offline</h1><p id="message">Connect to the internet to open your training and records. Offline activity is not saved.</p><button id="retry" type="button">Try again</button></main><script>const copy={"en":["You are offline","Connect to the internet to open your training and records. Offline activity is not saved.","Try again"],"es":["Sin conexión","Conéctate a internet para abrir tu formación y tus registros. La actividad sin conexión no se guarda.","Reintentar"],"fr":["Vous êtes hors ligne","Connectez-vous à Internet pour accéder à vos formations et dossiers. L’activité hors ligne n’est pas enregistrée.","Réessayer"],"de":["Sie sind offline","Verbinden Sie sich mit dem Internet, um Ihre Schulungen und Nachweise zu öffnen. Offline-Aktivitäten werden nicht gespeichert.","Erneut versuchen"],"it":["Sei offline","Connettiti a Internet per aprire la formazione e i tuoi dati. Le attività offline non vengono salvate.","Riprova"],"nl":["Je bent offline","Maak verbinding met internet om je trainingen en gegevens te openen. Offline activiteiten worden niet opgeslagen.","Opnieuw proberen"],"pt":["Está offline","Ligue-se à internet para abrir a formação e os registos. A atividade offline não é guardada.","Tentar novamente"],"pl":["Jesteś offline","Połącz się z internetem, aby otworzyć szkolenia i dokumentację. Aktywność offline nie jest zapisywana.","Spróbuj ponownie"],"ro":["Ești offline","Conectează-te la internet pentru a deschide instruirea și înregistrările. Activitatea offline nu este salvată.","Încearcă din nou"],"cs":["Jste offline","Připojte se k internetu pro otevření školení a záznamů. Aktivita offline se neukládá.","Zkusit znovu"],"sk":["Ste offline","Pripojte sa k internetu na otvorenie školení a záznamov. Aktivita offline sa neukladá.","Skúsiť znova"],"sl":["Niste povezani","Povežite se z internetom za dostop do usposabljanja in evidenc. Dejavnost brez povezave se ne shranjuje.","Poskusi znova"],"hu":["Nincs internetkapcsolat","A képzés és a nyilvántartások megnyitásához csatlakozzon az internethez. Az offline tevékenységeket a rendszer nem menti.","Próbálja újra"],"ar":["أنت غير متصل","اتصل بالإنترنت لفتح التدريب والسجلات. لا يتم حفظ النشاط دون اتصال.","حاول مجدداً"]};let lang=navigator.language.split('-')[0];try{lang=localStorage.getItem('primark-language')||lang}catch{}const text=copy[lang]||copy.en;document.documentElement.lang=copy[lang]?lang:'en';document.documentElement.dir=lang==='ar'?'rtl':'ltr';document.title=text[0];['title','message','retry'].forEach((id,i)=>document.getElementById(id).textContent=text[i]);document.getElementById('retry').onclick=()=>location.reload();</script></body></html>
